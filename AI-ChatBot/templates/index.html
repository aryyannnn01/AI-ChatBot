<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Support Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .user {
            background: #075985;
            text-align: right;
        }

        .bot {
            background: #334155;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Student Support</h1>
        <div id="messages"></div>

        <form id="chat-form" class="controls">
            <input id="message" placeholder="Ask a student question..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                addMessage(data.response, "bot");
            } catch (error) {
                addMessage("Unable to connect to the server.", "bot");
            }
        });

        addMessage("Hello! Ask me about admissions, fees, exams, attendance, or courses.", "bot");
    </script>
</body>
</html>
